# =============================================================================
# nginx — production, www.recycletechnologies.com
#
#   sudo cp deploy/nginx/recycletechnologies.com.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/recycletechnologies.com.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Certificates: Let's Encrypt via certbot, ONE certificate covering both names:
#   sudo certbot certonly --webroot -w /var/www/certbot \
#        -d recycletechnologies.com -d www.recycletechnologies.com
# (Issue it only AFTER DNS points at this server; until then use the HTTP
# block alone, or issue with a DNS challenge.)
#
# !! NO SECURITY add_header LINES IN HERE. next.config.ts already sends
# Strict-Transport-Security, X-Frame-Options, X-Content-Type-Options,
# Referrer-Policy and Permissions-Policy on every response, public/ files
# included. The dev server's nginx added its own copies as well, so every
# response carried two HSTS headers with different values (RTI-12). One
# source, and it is the one in git.
# =============================================================================

# Every http:// request, both names -> https://www in ONE hop.
server {
    listen 80;
    listen [::]:80;
    server_name recycletechnologies.com www.recycletechnologies.com;

    # certbot's renewal challenge must stay reachable over plain HTTP.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / { return 301 https://www.recycletechnologies.com$request_uri; }
}

# https://recycletechnologies.com (no www) -> https://www, ONE hop.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name recycletechnologies.com;

    ssl_certificate     /etc/letsencrypt/live/recycletechnologies.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/recycletechnologies.com/privkey.pem;

    return 301 https://www.recycletechnologies.com$request_uri;
}

# The site.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.recycletechnologies.com;

    ssl_certificate     /etc/letsencrypt/live/recycletechnologies.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/recycletechnologies.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Admin media uploads come through the app.
    client_max_body_size 50m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml text/x-component;

    access_log /var/log/nginx/recycletechnologies.access.log;
    error_log  /var/log/nginx/recycletechnologies.error.log;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # $remote_addr, NOT $proxy_add_x_forwarded_for. The lead, subscribe
        # and locate routes rate-limit on the FIRST address in this header;
        # appending would let a caller put any address they like first and
        # walk straight past the limit. (Behind Cloudflare, set the real client
        # IP with the realip module first, then this still holds.)
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_read_timeout 60s;
    }
}
